log_format antiddos '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

limit_req_zone $binary_remote_addr zone=anti_ddos_limit:10m rate=10r/s;

server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/access.log antiddos;

    location / {
        limit_req zone=anti_ddos_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://juice-shop:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }

    location /stub_status {
        access_log off;
        stub_status;
        allow all;
    }
}
