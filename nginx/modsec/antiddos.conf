# 10001 : outils d'attaque connus (Locust utilise python-requests)
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(python-requests|locust|apachebench|siege|wrk|hulk|loic|sqlmap|nikto)" \
    "id:10001,phase:1,deny,status:403,log,msg:'Anti-DDoS: User-Agent outil d attaque'"

# 10002 : requête sans User-Agent
SecRule &REQUEST_HEADERS:User-Agent "@eq 0" \
    "id:10002,phase:1,deny,status:403,log,msg:'Anti-DDoS: User-Agent absent'"

# 10003 : corps trop gros (POST flood volumineux)
SecRule REQUEST_HEADERS:Content-Length "@gt 100000" \
    "id:10003,phase:1,deny,status:413,log,msg:'Anti-DDoS: corps de requete trop volumineux'"
