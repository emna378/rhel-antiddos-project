global:
  scrape_interval: 5s 

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'nginx-exporter'
    static_configs:
      - targets: ['nginx-exporter:9113']


  - job_name: 'nginxlog-exporter'
    static_configs:
      - targets: ['nginxlog-exporter:4040']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['192.168.87.132:9100']
